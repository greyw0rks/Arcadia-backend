name: ci

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install verified Gitleaks 8.30.1
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan complete Git history
        run: '"${{ runner.temp }}/gitleaks" git --log-opts=--all --redact'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Root install also resolves the packages/sdk workspace.
      - name: Install
        run: npm ci

      # Wallet SDK advisories still need upstream fixes; keep them visible and
      # block new critical findings. See docs/SECURITY_REVIEW.md for the inventory.
      - name: Audit production dependencies
        run: npm run audit:production -- --audit-level=critical

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      # DATABASE_URL is deliberately unset: server/db.ts falls back to in-memory
      # when absent, and the build must keep working on that path.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_ARCADE_ADDRESS: '0x0000000000000000000000000000000000000001'
          NEXT_PUBLIC_WC_PROJECT_ID: ci
